<!DOCTYPE html>

<!-- Load d3.js -->

<!-- Create a div where the graph will be -->

<script src="download.js"></script>
<script src="index.js"></script>

<!-- call draw method in D3Draw class -->
<script>
    const d3Draw = new D3Draw();

        [12,19,11,13,12,22,13,4,15,16,18,19,20,12,11,9],

            "width": 600,

            "point-color": "blue",
        }
    );
</script>
